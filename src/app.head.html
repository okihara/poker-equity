<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script>/* Set the theme before the body paints, so a saved dark theme does not flash light; app.js applyTheme() takes over from here. */
try{const t=localStorage.getItem('eqtheme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){}</script>
