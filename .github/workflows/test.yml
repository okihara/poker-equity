# Runs the whole suite on every push and pull request. The app has no
# dependencies, so there is nothing to install. test/build.test.js also fails
# when index.html or dist/artifact.html were not rebuilt after a change to src/.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
